<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamPulse Beta 3 Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#eef2ff;font-family:Segoe UI,Arial,sans-serif}.wrap{max-width:1100px;margin:24px auto;padding:18px}.card{background:#151a24;border:1px solid #293244;border-radius:18px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:#aeb8ca;margin-bottom:6px}input,select{width:100%;background:#0d1118;color:#fff;border:1px solid #303a4d;border-radius:10px;padding:10px}.full{grid-column:1/-1}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}button.primary{background:#fff;color:#111827}.danger{background:#3b1820;color:#ffd8df}.hint{color:#8f9bb0;font-size:12px;margin-top:5px}.status{margin-top:14px;padding:10px;border:1px solid #293244;border-radius:10px;color:#aeb8ca}.preview{margin-top:18px;height:300px;border-radius:14px;overflow:hidden;position:relative;background:#111;border:1px solid #293244}.preview .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:25px;min-width:45%;transition:.2s}.preview h2{margin:0 0 10px;font-size:30px}.preview p{margin:0 0 22px}.preview .time{font-size:58px;font-weight:700}.preview .warn{margin-top:12px;font-weight:700}.pos{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1 id="h">StreamPulse Beta 3</h1><p id="d"></p><div class="grid"><div><label id="langL">Язык</label><select id="lang"><option value="ru">Русский</option><option value="en">English</option></select></div><div><label id="themeL">Тема</label><select id="theme"><option value="clean">Clean</option><option value="dark">Dark</option><option value="minimal">Minimal</option><option value="neon">Neon</option><option value="classic">Classic</option><option value="glass">Glass</option></select></div><div><label id="minL">Минуты</label><input id="min" type="number" min="0" max="30" value="5"></div><div><label id="secL">Секунды</label><input id="sec" type="number" min="0" max="59" value="0"></div><div class="full"><label id="titleL">Заголовок</label><input id="title"></div><div class="full"><label id="subL">Подзаголовок</label><input id="sub"></div><div><label id="soonL">Предупреждение</label><input id="soon"></div><div><label id="startedL">После таймера</label><input id="started"></div><div><label id="animL">Анимация</label><select id="anim"><option value="none">None / Нет</option><option value="fade">Fade / Плавная</option><option value="float">Float / Движение</option><option value="slide">Slide / Слайд</option><option value="zoom">Zoom / Масштаб</option><option value="glow">Glow / Свечение</option></select></div><div><label id="darkL">Затемнение</label><input id="dark" type="range" min="0" max="80" value="35"></div><div><label id="fontL">Размер элементов</label><input id="fontScale" type="range" min="70" max="130" value="100"></div><div><label id="opacityL">Прозрачность блока</label><input id="contentOpacity" type="range" min="20" max="100" value="100"></div><div><label id="colorL">Цвет текста</label><input id="textColor" type="color" value="#ffffff"></div><div><label id="xL">Положение по горизонтали</label><input id="positionX" type="range" min="-40" max="40" value="0"></div><div><label id="yL">Положение по вертикали</label><input id="positionY" type="range" min="-40" max="40" value="0"></div><div class="full"><label id="bgL">Фон — фото или видео</label><input id="bg" type="file" accept="image/*,video/*"><div class="hint" id="bgHint">Видео: до 30 секунд и 120 МБ.</div></div><div class="full"><label id="musicL">Музыка ожидания</label><input id="music" type="file" accept="audio/*"><div class="hint" id="musicHint">Перед эфиром музыка плавно затихает.</div></div><div><label id="mvL">Громкость музыки</label><input id="mv" type="range" min="0" max="100" value="35"></div><div><label id="tvL">Громкость сигнала</label><input id="tv" type="range" min="0" max="100" value="50"></div><div><label id="svL">Громкость старта</label><input id="sv" type="range" min="0" max="100" value="70"></div><div><label><input id="me" type="checkbox" checked> <span id="meL">Музыка</span></label><label><input id="te" type="checkbox" checked> <span id="teL">Сигнал последних секунд</span></label><label><input id="se" type="checkbox" checked> <span id="seL">Звук старта</span></label></div><div class="full"><label id="audioL">Аудиофайлы</label><input id="tick" type="file" accept="audio/*"><div class="hint" id="tickHint">Tick: последние 10 секунд.</div><input id="startSound" type="file" accept="audio/*" style="margin-top:8px"><div class="hint" id="startHint">Start: момент 00:00.</div></div></div><div class="row"><button class="primary" id="start"></button><button id="save"></button><button id="test"></button><button id="resetTimer" class="danger"></button><button id="resetAll" class="danger"></button></div><div class="status" id="status"></div><div class="preview" id="preview"><div class="box" id="pbox"><h2 id="ptitle">ЭФИР СКОРО НАЧНЁТСЯ</h2><p id="psub">Пристегнитесь — мы почти в эфире</p><div class="time">05:00</div><div class="warn" id="pwarn">СКОРО ЭФИР</div></div></div></div></div><script>const DB="StreamOverlayV3",STORE="background",$=id=>document.getElementById(id);let files={};const T={ru:{h:"Админ-панель StreamPulse Beta 3",d:"Настрой Beta 3. Предпросмотр ниже показывает расположение и оформление оверлея. В OBS используй start.html.",lang:"Язык",theme:"Тема",min:"Минуты",sec:"Секунды",title:"Заголовок",sub:"Подзаголовок",soon:"Предупреждение",after:"После таймера",anim:"Анимация",dark:"Затемнение",font:"Размер элементов",opacity:"Прозрачность блока",color:"Цвет текста",x:"Положение по горизонтали",y:"Положение по вертикали",bg:"Фон — фото или видео",bgHint:"Видео: до 30 секунд и 120 МБ.",music:"Музыка ожидания",musicHint:"Перед эфиром музыка плавно затихает.",mv:"Громкость музыки",tv:"Громкость сигнала",sv:"Громкость старта",audio:"Аудиофайлы",tickHint:"Tick: последние 10 секунд.",startHint:"Start: момент 00:00.",musicOn:"Музыка",tickOn:"Сигнал последних секунд",startOn:"Звук старта",start:"Запустить таймер",save:"Сохранить настройки",test:"Тест 10 секунд",resetTimer:"Сбросить таймер",resetAll:"Сбросить настройки",saved:"Настройки сохранены",started:"Таймер запущен",reset:"Таймер сброшен",testDone:"Тест запущен",resetDone:"Настройки сброшены"},en:{h:"StreamPulse Beta 3 Admin",d:"Configure Beta 3. The preview shows the overlay position and styling. Use start.html in OBS.",lang:"Language",theme:"Theme",min:"Minutes",sec:"Seconds",title:"Title",sub:"Subtitle",soon:"Warning",after:"After timer",anim:"Animation",dark:"Background dim",font:"Element size",opacity:"Block opacity",color:"Text color",x:"Horizontal position",y:"Vertical position",bg:"Background image / video",bgHint:"Video: up to 30 seconds and 120 MB.",music:"Waiting music",musicHint:"Music fades out smoothly before the stream starts.",mv:"Music volume",tv:"Tick volume",sv:"Start volume",audio:"Audio files",tickHint:"Tick: last 10 seconds.",startHint:"Start: at 00:00.",musicOn:"Music",tickOn:"Last-seconds signal",startOn:"Start sound",start:"Start timer",save:"Save settings",test:"Test 10 seconds",resetTimer:"Reset timer",resetAll:"Reset settings",saved:"Settings saved",started:"Timer started",reset:"Timer reset",testDone:"Test started",resetDone:"Settings reset"}};function db(){return new Promise((r,j)=>{let q=indexedDB.open(DB,2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}async function put(k,b,t,n){let d=await db();return new Promise((r,j)=>{let x=d.transaction(STORE,"readwrite");x.objectStore(STORE).put({blob:b,type:t,name:n,size:b.size},k);x.oncomplete=r;x.onerror=()=>j(x.error)})}async function clearFiles(){let d=await db();return new Promise((r,j)=>{let x=d.transaction(STORE,"readwrite").objectStore(STORE);["background","music","tick","start"].forEach(k=>x.delete(k));x.transaction.oncomplete=r;x.transaction.onerror=()=>j(x.transaction.error)})}function tr(){return T[$("lang").value||"ru"]}function applyText(){let t=tr();for(const [id,key] of Object.entries({h:"h",d:"d",langL:"lang",themeL:"theme",minL:"min",secL:"sec",titleL:"title",subL:"sub",soonL:"soon",startedL:"after",animL:"anim",darkL:"dark",fontL:"font",opacityL:"opacity",colorL:"color",xL:"x",yL:"y",bgL:"bg",bgHint:"bgHint",musicL:"music",musicHint:"musicHint",mvL:"mv",tvL:"tv",svL:"sv",audioL:"audio",tickHint:"tickHint",startHint:"startHint",meL:"musicOn",teL:"tickOn",seL:"startOn",start:"start",save:"save",test:"test",resetTimer:"resetTimer",resetAll:"resetAll"}))$(id).textContent=t[key];preview()}function save(){let s={lang:$("lang").value,theme:$("theme").value,min:+$("min").value,sec:+$("sec").value,title:$("title").value,sub:$("sub").value,soon:$("soon").value,started:$("started").value,anim:$("anim").value,dark:+$("dark").value,fontScale:+$("fontScale").value,contentOpacity:+$("contentOpacity").value,textColor:$("textColor").value,positionX:+$("positionX").value,positionY:+$("positionY").value,musicEnabled:$("me").checked,tickEnabled:$("te").checked,startEnabled:$("se").checked,musicVolume:+$("mv").value/100,tickVolume:+$("tv").value/100,startVolume:+$("sv").value/100};localStorage.setItem("streamOverlaySettings",JSON.stringify(s));localStorage.setItem("streamOverlayPing",Date.now());return s}function preview(){let s={lang:$("lang").value,theme:$("theme").value,title:$("title").value,sub:$("sub").value,soon:$("soon").value,fontScale:+$("fontScale").value,contentOpacity:+$("contentOpacity").value,positionX:+$("positionX").value,positionY:+$("positionY").value,textColor:$("textColor").value,dark:+$("dark").value};$("ptitle").textContent=s.title;$("psub").textContent=s.sub;$("pwarn").textContent=s.soon;$("ptitle").style.color=$("psub").style.color=$("pwarn").style.color=s.textColor;$("pbox").style.opacity=s.contentOpacity/100;$("pbox").style.transform=`translate(calc(-50% + ${s.positionX}vw),calc(-50% + ${s.positionY}vh)) scale(${s.fontScale/100})`;$("preview").style.background=`rgba(0,0,0,${s.dark/100})`;}async function store(){save();for(let k of Object.keys(files))if(files[k])await put(k,files[k],k==="background"?(files[k].type.startsWith("video/")?"video":"image"):"audio",files[k].name);$("status").textContent=tr().saved}$("lang").onchange=()=>{applyText();save()};for(const [id,key] of [["bg","background"],["music","music"],["tick","tick"],["startSound","start"]])$(id).onchange=()=>{let f=$(id).files[0];if(f)files[key]=f};["theme","title","sub","soon","started","anim","dark","fontScale","contentOpacity","textColor","positionX","positionY"].forEach(id=>$(id).addEventListener("input",preview));$("save").onclick=store;$("start").onclick=async()=>{await store();let n=Math.max(0,+$("min").value*60+(+$("sec").value||0));localStorage.setItem("streamEndTime",Date.now()+n*1000);localStorage.setItem("streamOverlayPing",Date.now());$("status").textContent=tr().started};$("test").onclick=async()=>{await store();localStorage.setItem("streamEndTime",Date.now()+10000);localStorage.setItem("streamOverlayPing",Date.now());$("status").textContent=tr().testDone};$("resetTimer").onclick=()=>{localStorage.removeItem("streamEndTime");localStorage.setItem("streamOverlayPing",Date.now());$("status").textContent=tr().reset};$("resetAll").onclick=async()=>{localStorage.removeItem("streamOverlaySettings");localStorage.removeItem("streamEndTime");await clearFiles();location.reload()};let s;try{s=JSON.parse(localStorage.getItem("streamOverlaySettings")||"{}")}catch(e){s={}}for(let k of ["lang","theme","min","sec","title","sub","soon","started","anim","dark","fontScale","contentOpacity","textColor","positionX","positionY"])if(s[k]!==undefined)$(k).value=s[k];$("me").checked=s.musicEnabled!==false;$("te").checked=s.tickEnabled!==false;$("se").checked=s.startEnabled!==false;$("mv").value=Math.round((s.musicVolume??.35)*100);$("tv").value=Math.round((s.tickVolume??.5)*100);$("sv").value=Math.round((s.startVolume??.7)*100);if(!$("title").value){let e=$("lang").value==="en";$("title").value=e?"STREAM STARTING SOON":"ЭФИР СКОРО НАЧНЁТСЯ";$("sub").value=e?"Get ready — we are almost live":"Пристегнитесь — мы почти в эфире";$("soon").value=e?"STREAM STARTING SOON":"СКОРО ЭФИР";$("started").value=e?"STREAM STARTED":"ЭФИР НАЧАЛСЯ"}applyText();</script></body></html>
