<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamPulse Beta Admin</title><style>body{margin:0;background:#0b0e14;color:#eef2ff;font-family:Segoe UI,Arial,sans-serif}.wrap{max-width:980px;margin:25px auto;padding:18px}.card{background:#151a24;border:1px solid #293244;border-radius:18px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:#aeb8ca;margin-bottom:6px}input,select{width:100%;box-sizing:border-box;background:#0d1118;color:#fff;border:1px solid #303a4d;border-radius:10px;padding:10px}.full{grid-column:1/-1}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}#start,#save{background:#fff;color:#111827}.hint{color:#8f9bb0;font-size:12px;margin-top:5px}.status{margin-top:14px;padding:10px;border:1px solid #293244;border-radius:10px;color:#aeb8ca}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1 id="h">StreamPulse Beta</h1><p id="d"></p><div class="grid"><div><label>Language / Язык</label><select id="lang"><option value="ru">Русский</option><option value="en">English</option></select></div><div><label id="themeL">Тема</label><select id="theme"><option>clean</option><option>dark</option><option>minimal</option><option>neon</option><option>classic</option><option>glass</option></select></div><div><label id="minL">Минуты</label><input id="min" type="number" min="0" max="30" value="5"></div><div><label id="secL">Секунды</label><input id="sec" type="number" min="0" max="59" value="0"></div><div class="full"><label id="titleL">Заголовок</label><input id="title"></div><div class="full"><label id="subL">Подзаголовок</label><input id="sub"></div><div><label id="soonL">Предупреждение</label><input id="soon"></div><div><label id="startedL">После таймера</label><input id="started"></div><div><label id="animL">Анимация</label><select id="anim"><option value="none">None / Нет</option><option value="fade">Fade / Плавная</option><option value="float">Float / Движение</option></select></div><div><label id="darkL">Затемнение</label><input id="dark" type="range" min="0" max="80" value="35"></div><div><label id="colorL">Цвет текста</label><input id="textColor" type="color" value="#ffffff"></div><div class="full"><label id="bgL">Фон — фото или видео</label><input id="bg" type="file" accept="image/*,video/*"><div class="hint">Видео: до 30 секунд и 120 МБ.</div></div><div class="full"><label id="musicL">Музыка ожидания</label><input id="music" type="file" accept="audio/*"><div class="hint">Файл хранится локально и зацикливается.</div></div><div><label id="mvL">Громкость музыки</label><input id="mv" type="range" min="0" max="100" value="35"></div><div><label id="tvL">Громкость сигнала</label><input id="tv" type="range" min="0" max="100" value="50"></div><div><label id="svL">Громкость старта</label><input id="sv" type="range" min="0" max="100" value="70"></div><div><label><input id="me" type="checkbox" checked> <span id="meL">Музыка</span></label></div><div><label><input id="te" type="checkbox" checked> <span id="teL">Сигнал последних секунд</span></label></div><div><label><input id="se" type="checkbox" checked> <span id="seL">Звук старта</span></label></div><div class="full"><label>Audio files / Аудиофайлы</label><input id="tick" type="file" accept="audio/*"><div class="hint">Tick: последние 10 секунд.</div><input id="startSound" type="file" accept="audio/*" style="margin-top:8px"><div class="hint">Start: момент 00:00.</div></div></div><div class="row"><button id="start"></button><button id="save"></button><button id="test"></button><button id="reset"></button></div><div class="status" id="status"></div></div></div><script>
const DB="StreamOverlayV3",STORE="background",$=id=>document.getElementById(id);let files={};const T={ru:{h:"Админ-панель StreamPulse Beta",d:"Настрой beta-версию. В OBS используй start.html.",start:"Запустить таймер",save:"Сохранить настройки",test:"Тест 10 секунд",reset:"Сбросить таймер",saved:"Настройки сохранены",started:"Таймер запущен",theme:"Тема",min:"Минуты",sec:"Секунды",title:"Заголовок",sub:"Подзаголовок",soon:"Предупреждение",after:"После таймера",anim:"Анимация",dark:"Затемнение",color:"Цвет текста",bg:"Фон — фото или видео",music:"Музыка ожидания",mv:"Громкость музыки",tv:"Громкость сигнала",sv:"Громкость старта"},en:{h:"StreamPulse Beta Admin",d:"Configure the beta version. Use start.html in OBS.",start:"Start timer",save:"Save settings",test:"Test 10 seconds",reset:"Reset timer",saved:"Settings saved",started:"Timer started",theme:"Theme",min:"Minutes",sec:"Seconds",title:"Title",sub:"Subtitle",soon:"Warning",after:"After timer",anim:"Animation",dark:"Background dim",color:"Text color",bg:"Background image / video",music:"Waiting music",mv:"Music volume",tv:"Tick volume",sv:"Start volume"}};
function db(){return new Promise((r,j)=>{let q=indexedDB.open(DB,2);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE)};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}async function put(k,b,t,n){let d=await db();return new Promise((r,j)=>{let x=d.transaction(STORE,"readwrite");x.objectStore(STORE).put({blob:b,type:t,name:n,size:b.size},k);x.oncomplete=r;x.onerror=()=>j(x.error)})}function tr(){return T[$("lang").value||"ru"]}function applyText(){let t=tr();$("h").textContent=t.h;$("d").textContent=t.d;let m={themeL:"theme",minL:"min",secL:"sec",titleL:"title",subL:"sub",soonL:"soon",startedL:"after",animL:"anim",darkL:"dark",colorL:"color",bgL:"bg",musicL:"music",mvL:"mv",tvL:"tv",svL:"sv",start:"start",save:"save",test:"test",reset:"reset"};for(let id in m)$(id).textContent=t[m[id]]}function save(){let s={lang:$("lang").value,theme:$("theme").value,min:+$("min").value,sec:+$("sec").value,title:$("title").value,sub:$("sub").value,soon:$("soon").value,started:$("started").value,anim:$("anim").value,dark:+$("dark").value,textColor:$("textColor").value,musicEnabled:$("me").checked,tickEnabled:$("te").checked,startEnabled:$("se").checked,musicVolume:+$("mv").value/100,tickVolume:+$("tv").value/100,startVolume:+$("sv").value/100};localStorage.setItem("streamOverlaySettings",JSON.stringify(s));localStorage.setItem("streamOverlayPing",Date.now())}async function store(){save();for(let k of Object.keys(files))if(files[k])await put(k,files[k],k==="background"?(files[k].type.startsWith("video/")?"video":"image"):"audio",files[k].name);$("status").textContent=tr().saved}$("lang").onchange=()=>{applyText();save()};$("bg").onchange=()=>{let f=$("bg").files[0];if(f)files.background=f};$("music").onchange=()=>{let f=$("music").files[0];if(f)files.music=f};$("tick").onchange=()=>{let f=$("tick").files[0];if(f)files.tick=f};$("startSound").onchange=()=>{let f=$("startSound").files[0];if(f)files.start=f};$("save").onclick=store;$("start").onclick=async()=>{await store();let n=Math.max(0,+$("min").value*60+(+$("sec").value||0));localStorage.setItem("streamEndTime",Date.now()+n*1000);localStorage.setItem("streamOverlayPing",Date.now());$("status").textContent=tr().started};$("test").onclick=()=>{save();localStorage.setItem("streamEndTime",Date.now()+10000);localStorage.setItem("streamOverlayPing",Date.now());$("status").textContent="10 seconds"};$("reset").onclick=()=>{localStorage.removeItem("streamEndTime");localStorage.setItem("streamOverlayPing",Date.now())};let s;try{s=JSON.parse(localStorage.getItem("streamOverlaySettings")||"{}")}catch(e){s={}}for(let k of ["lang","theme","min","sec","title","sub","soon","started","anim","dark","textColor"]){if(s[k]!==undefined)$(k).value=s[k]}$("me").checked=s.musicEnabled!==false;$("te").checked=s.tickEnabled!==false;$("se").checked=s.startEnabled!==false;$("mv").value=Math.round((s.musicVolume??.35)*100);$("tv").value=Math.round((s.tickVolume??.5)*100);$("sv").value=Math.round((s.startVolume??.7)*100);if(!$("title").value){let e=$("lang").value==="en";$("title").value=e?"STREAM STARTING SOON":"ЭФИР СКОРО НАЧНЁТСЯ";$("sub").value=e?"Get ready — we are almost live":"Пристегнитесь — мы почти в эфире";$("soon").value=e?"STREAM STARTING SOON":"СКОРО ЭФИР";$("started").value=e?"STREAM STARTED":"ЭФИР НАЧАЛСЯ"}applyText();</script></body></html>
