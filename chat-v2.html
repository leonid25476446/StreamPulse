<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamPulse Chat v2</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:#fff}.chat{position:fixed;right:24px;bottom:24px;width:min(430px,42vw);display:flex;flex-direction:column;gap:10px}.msg{padding:12px 14px;border-radius:14px;background:#000b;backdrop-filter:blur(8px);box-shadow:0 8px 30px #0005;animation:in .3s ease}.name{font-weight:800;font-size:14px;opacity:.92}.text{margin-top:4px;font-size:18px;line-height:1.3;overflow-wrap:anywhere}.badge{font-size:11px;margin-left:6px;padding:2px 6px;border-radius:8px;background:#fff2}.event{padding:14px;border-radius:14px;background:#000c;text-align:center;font-weight:800;animation:event .45s ease}.hidden{display:none}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes event{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}</style></head><body><div id="chat" class="chat"></div><script>
const KEY='streampulse-v2-chat',SET='streampulse-v2-settings',MAX=12,chat=document.getElementById('chat');let channel=null,queue=[],speaking=false;try{channel=new BroadcastChannel('streampulse-v2')}catch(e){}
function settings(){try{return JSON.parse(localStorage.getItem(SET)||'{}')}catch(e){return {}}}function add(m){const s=settings();if(s.show===false||!m?.text)return;if(s.source&&s.source!=='both'&&s.source!==m.platform)return;const el=document.createElement('div');el.className='msg';const n=document.createElement('div');n.className='name';n.textContent=m.name||'Viewer';if(s.icons!==false){const b=document.createElement('span');b.className='badge';b.textContent=(m.platform||'chat').toUpperCase();n.appendChild(b)}const t=document.createElement('div');t.className='text';t.textContent=m.text;el.append(n,t);const delay=Math.max(0,Number(s.delay)||0)*1000;if(delay)setTimeout(()=>append(el,s),delay);else append(el,s)}function append(el,s){if(s.anim===false)el.style.animation='none';chat.appendChild(el);const max=Math.max(1,Number(s.max)||MAX);while(chat.children.length>max)chat.firstChild.remove()}
function event(m){const el=document.createElement('div');el.className='event';el.textContent=m.event||'Новое событие';chat.appendChild(el);setTimeout(()=>el.remove(),6000)}function speak(m){if(!m?.text)return;queue.push(m);runTts()}function runTts(){if(speaking||!queue.length)return;const m=queue.shift();speaking=true;const u=new SpeechSynthesisUtterance(m.text);u.lang=m.lang||'ru-RU';u.rate=.95;u.volume=1;u.onend=()=>{speaking=false;setTimeout(runTts,250)};u.onerror=()=>{speaking=false;runTts()};speechSynthesis.cancel();speechSynthesis.speak(u)}function clearTts(){queue=[];speechSynthesis.cancel();speaking=false}
function on(e){try{const m=typeof e.data==='string'?JSON.parse(e.data):e.data;if(m?.type==='chat')add(m);else if(m?.type==='tts')speak(m);else if(m?.type==='tts-clear')clearTts();else if(m?.type==='event')event(m)}catch(_){} }if(channel)channel.onmessage=on;window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)on({data:e.newValue})});
try{JSON.parse(localStorage.getItem(KEY)||'[]').slice(-MAX).forEach(m=>{if(m.type==='chat')add(m)})}catch(_){}
</script></body></html>
