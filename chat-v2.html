<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamPulse Chat v2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Segoe UI,Arial,sans-serif;color:#fff}.chat{position:fixed;right:24px;bottom:24px;width:min(420px,42vw);display:flex;flex-direction:column;gap:10px}.msg{padding:12px 14px;border-radius:14px;background:#0009;backdrop-filter:blur(8px);box-shadow:0 8px 30px #0005;animation:in .3s ease}.name{font-weight:800;font-size:14px;opacity:.9}.text{margin-top:4px;font-size:18px;line-height:1.3;overflow-wrap:anywhere}.badge{font-size:11px;margin-left:6px;padding:2px 6px;border-radius:8px;background:#fff2}.yt{border-left:3px solid #fff}.tw{border-left:3px solid #fff}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style></head><body><div id="chat" class="chat"></div><script>
const KEY='streampulse-v2-chat',MAX=12;const chat=document.getElementById('chat');let channel=null;try{channel=new BroadcastChannel('streampulse-v2')}catch(e){}
function add(m){if(!m||!m.text)return;const el=document.createElement('div');el.className='msg '+(m.platform==='twitch'?'tw':'yt');const n=document.createElement('div');n.className='name';n.textContent=m.name||'Viewer';const b=document.createElement('span');b.className='badge';b.textContent=(m.platform||'chat').toUpperCase();n.appendChild(b);const t=document.createElement('div');t.className='text';t.textContent=m.text;el.append(n,t);chat.appendChild(el);while(chat.children.length>MAX)chat.firstChild.remove();}
function on(e){try{const m=typeof e.data==='string'?JSON.parse(e.data):e.data;if(m&&m.type==='chat')add(m)}catch(_){} }
if(channel)channel.onmessage=on;window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue)on({data:e.newValue})});
try{JSON.parse(localStorage.getItem(KEY)||'[]').slice(-MAX).forEach(add)}catch(_){}
</script></body></html>
