<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Эфир скоро начнётся</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Segoe UI,Arial,sans-serif;color:#fff}
#bgImg,#bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.35)}
#content{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vw}
#title{font-size:clamp(38px,5vw,82px);font-weight:700;letter-spacing:.04em;margin:0 0 20px;text-shadow:0 5px 25px #000}
#sub{font-size:clamp(18px,2vw,30px);font-weight:600;opacity:.92;margin-bottom:50px;text-shadow:0 3px 15px #000}
#timer{font-size:clamp(72px,10vw,170px);font-weight:700;letter-spacing:.05em;line-height:1;text-shadow:0 7px 30px #000;transition:color .15s,text-shadow .15s}
#soon{display:none;margin-top:22px;font-size:clamp(16px,1.7vw,27px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 3px 18px #000}
#timer.warning .seconds{transition:none}
#timer.warning.red .seconds{color:#ff304f!important;text-shadow:0 0 12px #ff304f,0 0 30px #ff304f}
#timer.warning.white .seconds{color:#fff!important;text-shadow:0 7px 30px #000}
.clean #title{font-weight:500}.clean #timer{font-weight:400}
.pixel #title,.pixel #timer{font-family:monospace;letter-spacing:.06em}
.neon #title,.neon #timer{text-shadow:0 0 12px #fff,0 0 35px #8ea0ff,0 0 65px #596dff}.neon #timer.warning.red .seconds{text-shadow:0 0 12px #ff304f,0 0 35px #ff304f!important}
.glass #content{background:#ffffff10;border:1px solid #ffffff25;border-radius:28px;backdrop-filter:blur(5px);inset:12% 12%}
.fade #content{animation:fade 1.2s ease}.float #content{animation:float 3s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style></head>
<body>
<img id="bgImg"><video id="bgVideo" autoplay muted loop playsinline></video><div id="shade"></div>
<div id="content"><div id="title">ЭФИР СКОРО НАЧНЁТСЯ</div><div id="sub">Пристегните ремни — мы почти в эфире 🚀</div><div id="timer"><span class="minutes">05</span>:<span class="seconds">00</span></div><div id="soon">⚠ СКОРО ЭФИР ⚠</div></div>
<script>
const DB="StreamOverlayV3",STORE="background";let objUrl=null;
const $=id=>document.getElementById(id);
function dbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getMedia(){try{const db=await dbOpen();return await new Promise((res,rej)=>{const q=db.transaction(STORE,"readonly").objectStore(STORE).get("background");q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch(e){return null}}
function loadSettings(){try{return JSON.parse(localStorage.getItem("streamOverlaySettings")||"{}")}catch(e){return{}}}
async function load(){
 const s=loadSettings(); $("title").textContent=s.title||"ЭФИР СКОРО НАЧНЁТСЯ";$("sub").textContent=s.sub||"Пристегните ремни — мы почти в эфире 🚀";
 $("shade").style.background=`rgba(0,0,0,${Math.max(0,Math.min(80,+s.dark||35))/100})`;$("title").style.color=s.textColor||"#fff";$("sub").style.color=s.textColor||"#fff";$("timer").style.color=s.textColor||"#fff";
 document.body.className=(s.style||"clean")+" "+(s.anim||"none");
 const m=await getMedia(),img=$("bgImg"),vid=$("bgVideo");img.style.display="none";vid.style.display="none";
 if(objUrl)URL.revokeObjectURL(objUrl);
 if(m){objUrl=URL.createObjectURL(m.blob);if(m.type==="video"){vid.src=objUrl;vid.style.display="block";vid.play().catch(()=>{})}else{img.src=objUrl;img.style.display="block"}}
}
function tick(){
 let end=+(localStorage.getItem("streamEndTime")||0),left=Math.max(0,end-Date.now());
 let total=Math.floor(left/1000),m=Math.floor(total/60),s=total%60;
 const timer=$("timer"), sec=timer.querySelector(".seconds"), min=timer.querySelector(".minutes"), soon=$("soon");
 min.textContent=String(m).padStart(2,"0"); sec.textContent=String(s).padStart(2,"0");
 const warning=total>0 && total<=180;
 timer.classList.toggle("warning",warning);
 if(warning){
   // Seconds alternate red/white once per second.
   timer.classList.toggle("red",s%2===1);
   timer.classList.toggle("white",s%2===0);
   soon.style.display="block";
 }else{
   timer.classList.remove("red","white");
   soon.style.display="none";
 }
 if(end&&left<=0){min.textContent="00";sec.textContent="00";soon.style.display="none";timer.classList.remove("warning","red","white")}
}
window.addEventListener("storage",()=>{load();tick()});load();tick();setInterval(tick,250);
</script></body></html>
