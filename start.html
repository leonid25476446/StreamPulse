<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StreamPulse</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{font-family:Segoe UI,Arial,sans-serif;color:#fff}#bgImg,#bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}#shade{position:fixed;inset:0;background:rgba(0,0,0,.35)}#content{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vw;transition:opacity .5s,transform .5s}#title{font-size:clamp(38px,5vw,82px);font-weight:700;letter-spacing:.04em;margin:0 0 20px;text-shadow:0 5px 25px #000}#sub{font-size:clamp(18px,2vw,30px);font-weight:600;opacity:.92;margin-bottom:50px;text-shadow:0 3px 15px #000}#timer{font-size:clamp(72px,10vw,170px);font-weight:700;letter-spacing:.05em;line-height:1;text-shadow:0 7px 30px #000;transition:transform .25s,opacity .25s}#soon{display:none;margin-top:22px;font-size:clamp(16px,1.7vw,27px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 3px 18px #000}.clean #title{font-weight:500}.clean #timer{font-weight:400}.pixel #title,.pixel #timer{font-family:monospace}.neon #title,.neon #timer{text-shadow:0 0 12px #fff,0 0 35px #8ea0ff,0 0 65px #596dff}.glass #content{background:#ffffff10;border:1px solid #ffffff25;border-radius:28px;backdrop-filter:blur(5px);inset:12% 12%}.fade #content{animation:fade 1.2s ease}.float #content{animation:float 3s ease-in-out infinite}@keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{50%{transform:scale(1.06);opacity:.8}}.last10{animation:pulse .8s ease-in-out infinite}.classic #content{font-family:Georgia,serif}.minimal #content{font-family:Arial,sans-serif}.dark #content{background:#0005;border-radius:20px;inset:10%}
</style></head><body><img id="bgImg"><video id="bgVideo" autoplay muted loop playsinline></video><div id="shade"></div><div id="content"><div id="title"></div><div id="sub"></div><div id="timer"><span id="minutes">05</span>:<span id="seconds">00</span></div><div id="soon"></div></div><audio id="music" loop></audio><audio id="tickSound"></audio><audio id="startSound"></audio><script>
const DB="StreamOverlayV3",STORE="background",MUSIC="music";let objUrl=null,musicUrl=null,tickUrl=null,startUrl=null,lastSecond=-1,started=false;$=id=>document.getElementById(id);
const I={ru:{title:"ЭФИР СКОРО НАЧНЁТСЯ",sub:"Пристегнитесь — мы почти в эфире",soon:"СКОРО ЭФИР",started:"ЭФИР НАЧАЛСЯ"},en:{title:"STREAM STARTING SOON",sub:"Get ready — we are almost live",soon:"STREAM STARTING SOON",started:"STREAM STARTED"}};
function dbOpen(){return new Promise((r,j)=>{let q=indexedDB.open(DB,2);q.onupgradeneeded=()=>{let d=q.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE)};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}async function get(k){try{let d=await dbOpen();return await new Promise((r,j)=>{let q=d.transaction(STORE,"readonly").objectStore(STORE).get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>j(q.error)})}catch(e){return null}}
function settings(){try{return JSON.parse(localStorage.getItem("streamOverlaySettings")||"{}")}catch(e){return{}}}function tr(s){return I[s.lang||"ru"]||I.ru}
async function load(){let s=settings(),t=tr(s);document.documentElement.lang=s.lang||"ru";$("title").textContent=s.title||t.title;$("sub").textContent=s.sub||t.sub;$("soon").textContent=s.soon||t.soon;$("shade").style.background=`rgba(0,0,0,${Math.max(0,Math.min(80,+s.dark||35))/100})`;["title","sub","timer","soon"].forEach(x=>$(x).style.color=s.textColor||"#fff");document.body.className=(s.theme||s.style||"clean")+" "+(s.anim||"none");
let bg=await get("background"),img=$("bgImg"),vid=$("bgVideo");img.style.display=vid.style.display="none";if(objUrl)URL.revokeObjectURL(objUrl);if(bg){objUrl=URL.createObjectURL(bg.blob);if(bg.type==="video"){vid.src=objUrl;vid.style.display="block";vid.play().catch(()=>{})}else{img.src=objUrl;img.style.display="block"}}
let mus=await get("music"),a=$("music");if(mus){if(musicUrl)URL.revokeObjectURL(musicUrl);musicUrl=URL.createObjectURL(mus.blob);a.src=musicUrl;a.volume=Math.max(0,Math.min(1,+s.musicVolume??.35));if(s.musicEnabled!==false)a.play().catch(()=>{})}else a.removeAttribute("src");}
function play(urlEl,vol){if(!urlEl.src)return;urlEl.currentTime=0;urlEl.volume=vol;urlEl.play().catch(()=>{})}function tick(){let end=+(localStorage.getItem("streamEndTime")||0),left=Math.max(0,end-Date.now()),total=Math.floor(left/1000),m=Math.floor(total/60),sec=total%60,s=settings(),t=tr(s);$("minutes").textContent=String(m).padStart(2,"0");$("seconds").textContent=String(sec).padStart(2,"0");let warning=total>0&&total<=180;$("soon").textContent=s.soon||t.soon;$("soon").style.display=warning?"block":"none";if(total<=10&&total>0&&sec!==lastSecond){$("timer").classList.add("last10");if(s.tickEnabled!==false)play($("tickSound"),Math.max(0,Math.min(1,+s.tickVolume??.5)));lastSecond=sec}else if(total>10)$("timer").classList.remove("last10");if(end&&left<=0&&!started){started=true;$("title").textContent=s.started||t.started;$("sub").textContent="";$("soon").style.display="none";$("timer").textContent="00:00";$("timer").classList.remove("last10");if(s.musicEnabled!==false)$("music").pause();if(s.startEnabled!==false)play($("startSound"),Math.max(0,Math.min(1,+s.startVolume??.7)))}}
window.addEventListener("storage",()=>{started=false;lastSecond=-1;load();tick()});load();tick();setInterval(tick,250);
</script></body></html>
